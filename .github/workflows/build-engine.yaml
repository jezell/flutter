  build-release:
    needs: build-engine-ios
    runs-on: depot-ubuntu-22.04-4
    defaults:
      run:
        shell: bash

    steps:
      - name: Free disk space
        if: contains(matrix.os, 'ubuntu')
        run: curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Setup gcloud
        env:
          GCP_CREDENTIALS: ${{ secrets.GOOGLE_STORAGE_BUCKET_SECRET }}
        run: |
          echo "$GCP_CREDENTIALS"  | base64 -d  > "$HOME"/gcloud.json
          gcloud auth activate-service-account --key-file="$HOME"/gcloud.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up depot_tools / gclient
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          # Append depot_tools to the PATH for subsequent steps
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: gclient sync macos
        run: |
          # Use custom gclient to trim size
          cp engine/scripts/slim-mac.gclient .gclient
          gclient sync -D

      - name: build ios release
        run: |

          cd engine/src

          gcloud storage cp --recursive 'gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ci/ios_profile.tar.gz' .
          tar -xzf ios_profile.tar.gz
          rm ios_profile.tar.gz

          gcloud storage cp --recursive 'gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ci/ios_debug.tar.gz' .
          tar -xzf ios_debug.tar.gz
          rm ios_debug.tar.gz

          gcloud storage cp --recursive 'gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ci/ios_release.tar.gz' .
          tar -xzf ios_release.tar.gz
          rm ios_release.tar.gz

          gcloud storage cp --recursive 'gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ci/ios_debug_sim.tar.gz' .
          tar -xzf ios_debug_sim.tar.gz
          rm ios_debug_sim.tar.gz

          gcloud storage cp --recursive 'gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ci/ios_debug_sim_arm64.tar.gz' .
          tar -xzf ios_debug_sim_arm64.tar.gz
          rm ios_debug_sim_arm64.tar.gz

          gcloud storage cp --recursive 'gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ci/ios_release_extension_safe.tar.gz' .
          tar -xzf ios_release_extension_safe.tar.gz
          rm ios_release_extension_safe.tar.gz

          gcloud storage cp --recursive 'gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ci/ios_debug_extension_safe.tar.gz' .
          tar -xzf ios_debug_extension_safe.tar.gz
          rm ios_debug_extension_safe.tar.gz

          gcloud storage cp --recursive 'gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ci/ios_debug_sim_arm64_extension_safe.tar.gz' .
          tar -xzf ios_debug_sim_arm64_extension_safe.tar.gz
          rm  ios_debug_sim_arm64_extension_safe.tar.gz

          gcloud storage cp --recursive 'gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ci/ios_debug_unopt_sim_arm64_extension_safe.tar.gz' .
          tar -xzf ios_debug_unopt_sim_arm64_extension_safe.tar.gz
          rm ios_debug_unopt_sim_arm64_extension_safe.tar.gz

          gcloud storage cp --recursive 'gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ci/ios_debug_sim_extension_safe.tar.gz' .
          tar -xzf ios_debug_sim_extension_safe.tar.gz
          rm ios_debug_sim_extension_safe.tar.gz

          gcloud storage cp --recursive 'gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ci/ios_profile_extension_safe.tar.gz' .
          tar -xzf ios_profile_extension_safe.tar.gz
          rm ios_profile_extension_safe.tar.gz

          gcloud storage cp --recursive 'gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ci/ios_release_extension_safe.tar.gz' .
          tar -xzf ios_release_extension_safe.tar.gz
          rm ios_release_extension_safe.tar.gz


          python3 flutter/sky/tools/create_ios_framework.py \
          --dst out/ios \
          --arm64-out-dir out/ci/ios_debug \
          --simulator-x64-out-dir out/ci/ios_debug_sim \
          --simulator-arm64-out-dir out/ci/ios_debug_sim_arm64 \
          --dsym \
          --strip

          python3 flutter/sky/tools/create_ios_framework.py \
          --dst out/ios_release \
          --arm64-out-dir out/ci/ios_release \
          --simulator-x64-out-dir out/ci/ios_debug_sim \
          --simulator-arm64-out-dir out/ci/ios_debug_sim_arm64 \
          --dsym \
          --strip \

          python3 flutter/sky/tools/create_ios_framework.py \
          --dst out/ios_profile \
          --arm64-out-dir out/ci/ios_profile \
          --simulator-x64-out-dir out/ci/ios_debug_sim \
          --simulator-arm64-out-dir out/ci/ios_debug_sim_arm64 \
          --dsym \
          --strip \

          gcloud storage cp --recursive out/ios/ gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ios/
          gcloud storage cp --recursive out/ios_release/ gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ios_release/
          gcloud storage cp --recursive out/ios_profile/ gs://flutter-builds/flutter_infra_release/flutter/engine/4baf71f9013dfe1ec59a68eace0de7b7927a1839/ios_profile/

